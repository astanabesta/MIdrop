name: Android debug APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: midrop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MIdrop-debug.apk
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --target "$GITHUB_SHA" --prerelease --title "Latest debug APK" --notes "Automatically built test APK. Not for production use."
          fi
          gh release upload debug-latest MIdrop-debug.apk --clobber
